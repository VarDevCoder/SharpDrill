    lang: text
    title: "Recorrido de arquitectura (plantilla)"
    code: |
      The frontend is a <tech> application.
      It talks to a <REST / GraphQL> API built with <tech>.
      The API handles <auth / validation / business rules>.
      Data is stored in <database>.
      <Async work> is handled by <queue / worker>.
      Everything is deployed on <platform> behind <gateway / load balancer>.
