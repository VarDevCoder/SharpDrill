id: ch17
number: 17
title: "Next.js (App Router)"
level: "Senior"
track: react
summary: "Server y Client Components, enrutado por archivos, obtención de datos y caché, Route Handlers, Server Actions, renderizado y despliegue."
objectives:
  - "Decidir qué va en un Server Component y qué en un Client Component."
  - "Controlar la caché y la revalidación de datos."
  - "Construir endpoints y mutaciones con Route Handlers y Server Actions."

sections:
  - id: s1
    title: "Estructura del App Router"
    body: |
      El enrutado se define con carpetas dentro de `app/`. Archivos especiales:

      | Archivo | Para qué |
      |---|---|
      | `page.tsx` | La UI de la ruta (la hace pública) |
      | `layout.tsx` | UI compartida que **persiste** entre navegaciones (no se vuelve a montar) |
      | `loading.tsx` | Fallback de Suspense mientras carga el segmento |
      | `error.tsx` | Error boundary del segmento (**debe ser Client Component**) |
      | `not-found.tsx` | UI para `notFound()` |
      | `route.ts` | Route Handler (endpoint HTTP), no puede convivir con `page.tsx` en la misma carpeta |

      Segmentos: dinámicos `[id]`, catch-all `[...slug]`, opcionales `[[...slug]]`, **grupos** `(marketing)` que no afectan a la URL, y rutas paralelas `@modal`.

      ```text
      app/
        layout.tsx
        page.tsx                 → /
        (tienda)/productos/
          page.tsx               → /productos
          [id]/page.tsx          → /productos/42
        api/pedidos/route.ts     → /api/pedidos
      ```

      Desde **Next.js 15**, `params` y `searchParams` son **Promises**: hay que hacer `await`.

      ```tsx
      export default async function Producto({ params }: { params: Promise<{ id: string }> }) {
        const { id } = await params;
        const p = await getProducto(id);
        if (!p) notFound();
        return <h1>{p.nombre}</h1>;
      }
      ```

  - id: s2
    title: "Server Components vs Client Components"
    body: |
      En el App Router, **todo es Server Component por defecto**: se ejecuta en el servidor, puede ser `async`, acceder a la BD o a secretos, y **no envía su JavaScript al navegador**.

      Un **Client Component** se marca con `'use client'` al inicio del archivo. Lo necesitas para estado (`useState`), efectos, manejadores de eventos (`onClick`) y APIs del navegador.

      ```tsx
      // app/productos/[id]/page.tsx — Server Component
      import { BotonCarrito } from './boton-carrito';
      export default async function Page({ params }: { params: Promise<{ id: string }> }) {
        const { id } = await params;
        const p = await db.producto.findUnique({ where: { id } });   // directo a la BD
        return <><h1>{p!.nombre}</h1><BotonCarrito id={id} /></>;
      }

      // app/productos/[id]/boton-carrito.tsx
      'use client';
      export function BotonCarrito({ id }: { id: string }) {
        const [n, setN] = useState(0);
        return <button onClick={() => setN(n + 1)}>Añadir ({n})</button>;
      }
      ```

      Reglas:

      - `'use client'` marca una **frontera**: todo lo que ese archivo importa pasa a formar parte del bundle del cliente. Empuja las fronteras hacia las hojas del árbol.
      - Las props que cruzan de servidor a cliente deben ser **serializables** (no funciones, salvo Server Actions).
      - Un Client Component **puede recibir Server Components como `children`**.
      - Variables de entorno: solo las que empiezan por `NEXT_PUBLIC_` llegan al navegador. Usa `import 'server-only'` en módulos que no deben filtrarse al cliente.

  - id: s3
    title: "Datos, caché y renderizado"
    body: |
      - **Estático** (por defecto cuando es posible): se renderiza en el build.
      - **Dinámico**: se renderiza por petición si usas `cookies()`, `headers()`, `searchParams` o datos sin caché.
      - **ISR**: estático con revalidación periódica (`export const revalidate = 60`).

      Cambio importante en **Next.js 15**: `fetch` **ya no se cachea por defecto**, y los Route Handlers `GET` tampoco. Lo pides explícitamente:

      ```tsx
      const r = await fetch('https://api.ejemplo.com/precios', { next: { revalidate: 300, tags: ['precios'] } });
      // tras una mutación:
      revalidateTag('precios');       // o revalidatePath('/productos')
      ```

      **Next.js 16** introduce **Cache Components** con la directiva `'use cache'` (activable en `next.config`) para cachear funciones o componentes de forma explícita, usa **Turbopack** por defecto en `dev` y `build`, y renombra `middleware.ts` a **`proxy.ts`**.

      **Streaming**: envuelve partes lentas en `<Suspense fallback={...}>` (o usa `loading.tsx`) para enviar el resto de la página antes.

      Evita las **cascadas**: lanza en paralelo las peticiones independientes.

      ```tsx
      const [user, pedidos] = await Promise.all([getUser(id), getPedidos(id)]);
      ```

  - id: s4
    title: "Route Handlers, Server Actions y autenticación"
    body: |
      **Route Handlers** (`app/api/.../route.ts`) exportan funciones por verbo HTTP con la API Web estándar:

      ```ts
      import { NextRequest } from 'next/server';
      export async function GET(req: NextRequest) {
        const q = req.nextUrl.searchParams.get('q') ?? '';
        const auth = req.headers.get('authorization');
        if (!auth?.startsWith('Bearer ')) return Response.json({ error: 'No autenticado' }, { status: 401 });
        return Response.json(await buscar(q));
      }
      ```

      **Server Actions**: funciones `async` con `'use server'` que se ejecutan en el servidor y se invocan desde formularios o eventos. Son endpoints públicos POST: **valida la entrada y la autorización dentro de la acción**.

      ```tsx
      'use server';
      export async function crearPedido(formData: FormData) {
        const session = await auth();
        if (!session) throw new Error('No autorizado');
        const sku = String(formData.get('sku'));
        await db.pedido.create({ data: { sku, userId: session.user.id } });
        revalidatePath('/pedidos');
      }
      ```

      **Proxy/middleware** (`proxy.ts` en Next 16, `middleware.ts` antes) se ejecuta antes de las rutas: redirecciones, reescrituras y comprobaciones ligeras de sesión. No lo uses como única barrera de autorización: verifica también en las páginas, acciones y handlers.

      Otras piezas: `next/image` (optimiza imágenes), `next/link` (navegación con prefetch), `export const metadata` / `generateMetadata` (SEO) y `next build && next start` o `output: 'standalone'` para contenedores.

cards:
  - id: c1
    front: "¿Qué tipo de componente es por defecto en el App Router?"
    back: "**Server Component**: se ejecuta en el servidor, puede ser async y no envía su JS al cliente. Para interactividad, `'use client'`."
  - id: c2
    front: "¿Qué hace exactamente `'use client'`?"
    back: "Marca la frontera servidor/cliente: ese archivo y todo lo que importa se incluye en el bundle del navegador."
  - id: c3
    front: "¿Qué cambió con `params` en Next.js 15?"
    back: "`params` y `searchParams` son Promises: `const { id } = await params;`"
  - id: c4
    front: "¿Se cachea `fetch` por defecto en Next.js 15?"
    back: "No. Se pide explícitamente con `{ cache: 'force-cache' }` o `{ next: { revalidate: n } }`."
  - id: c5
    front: "¿Cómo invalidar datos cacheados tras una mutación?"
    back: "`revalidatePath('/ruta')` o `revalidateTag('tag')` (asignando `tags` en el fetch)."
  - id: c6
    front: "¿Qué variables de entorno llegan al navegador?"
    back: "Solo las prefijadas con `NEXT_PUBLIC_`, que se incrustan en el build. El resto solo existe en el servidor."
  - id: c7
    front: "¿Qué debe validarse dentro de una Server Action?"
    back: "La autenticación/autorización y la entrada: es un endpoint POST público que cualquiera puede invocar."
  - id: c8
    front: "¿Por qué `error.tsx` debe ser Client Component?"
    back: "Es un error boundary de React, que necesita estado y la función `reset()` en el cliente."
  - id: c9
    front: "¿Cómo se llama el antiguo middleware en Next.js 16?"
    back: "`proxy.ts` (función `proxy`), que sustituye a `middleware.ts`."

questions:
  - id: q1
    type: mcq
    prompt: "¿Qué ocurre si usas `useState` en `app/page.tsx` sin `'use client'`?"
    options: ["Funciona igual", "Error: los hooks de estado solo funcionan en Client Components", "Se convierte solo en Client Component", "Se ignora el estado"]
    answer: 1
    explanation: "Los Server Components no tienen estado ni efectos; el build falla indicando que hace falta 'use client'."
  - id: q2
    type: tf
    prompt: "Un Client Component puede renderizar un Server Component si lo recibe como `children`."
    answer: true
    explanation: "El Server Component se renderiza en el servidor y se pasa como resultado (RSC payload) al cliente."
  - id: q3
    type: mcq
    prompt: "En Next.js 15, ¿cómo se lee el parámetro dinámico en `app/productos/[id]/page.tsx`?"
    options:
      - "props.params.id directamente"
      - "const { id } = await params;"
      - "useRouter().query.id"
      - "getServerSideProps"
    answer: 1
    explanation: "params es una Promise desde Next 15. useRouter().query y getServerSideProps son del Pages Router."
  - id: q4
    type: mcq
    prompt: "Quieres que una lista de precios se cachee y se refresque como máximo cada 5 minutos. ¿Qué haces?"
    options:
      - "fetch(url) sin opciones"
      - "fetch(url, { next: { revalidate: 300 } })"
      - "fetch(url, { cache: 'no-store' })"
      - "useEffect con setInterval"
    answer: 1
    explanation: "revalidate: 300 aplica ISR: sirve la caché y la regenera en segundo plano pasado ese tiempo."
  - id: q5
    type: fill
    prompt: "Completa: la directiva que marca una función como Server Action es `'______'`."
    answer: ["use server"]
    explanation: "'use server' al inicio de la función o del archivo."
  - id: q6
    type: tf
    prompt: "La variable `DATABASE_URL` definida en `.env` es accesible desde un Client Component con `process.env.DATABASE_URL`."
    answer: false
    explanation: "Solo las variables NEXT_PUBLIC_ se exponen al cliente. Por seguridad, las demás quedan en el servidor."
  - id: q7
    type: mcq
    prompt: "¿Cuál es la mejor forma de cargar `user` y `pedidos`, que no dependen entre sí, en un Server Component?"
    options:
      - "const u = await getUser(); const p = await getPedidos();"
      - "const [u, p] = await Promise.all([getUser(), getPedidos()]);"
      - "Cargar ambos en un useEffect"
      - "Encadenar con .then dentro del JSX"
    answer: 1
    explanation: "Promise.all evita la cascada: ambas peticiones corren en paralelo."
  - id: q8
    type: mcq
    prompt: "¿Qué archivo define un endpoint `GET /api/salud`?"
    options: ["app/api/salud/page.tsx", "app/api/salud/route.ts con export async function GET", "pages/api/salud.tsx en el App Router", "app/salud/layout.tsx"]
    answer: 1
    explanation: "Los Route Handlers viven en route.ts y exportan funciones con el nombre del verbo."

drills:
  - id: d1
    lang: tsx
    title: "Página dinámica con await params y notFound"
    timeLimit: 180
    prompt: |
      Escribe `app/productos/[id]/page.tsx`: Server Component **async** que lea `id` de `params` (Next 15+),
      llame a `getProducto(id)` y use `notFound()` si no existe; si existe, muestra el nombre en un `<h1>`.
    solution: |
      import { notFound } from 'next/navigation';
      import { getProducto } from '@/lib/productos';

      export default async function Page({ params }: { params: Promise<{ id: string }> }) {
        const { id } = await params;
        const producto = await getProducto(id);
        if (!producto) notFound();
        return <h1>{producto.nombre}</h1>;
      }
    checks:
      - pattern: 'export\s+default\s+async\s+function'
        hint: "`export default async function Page(...)`"
      - pattern: 'params\s*:\s*Promise\s*<'
        hint: "Tipa `params: Promise<{ id: string }>`"
      - pattern: 'await\s+params'
        hint: "`const { id } = await params;`"
      - pattern: 'notFound\s*\(\s*\)'
        hint: "Llama a `notFound()` si no existe"
      - pattern: 'from\s+[''"]next/navigation[''"]'
        hint: "Importa notFound de 'next/navigation'"
      - pattern: '[''"]use client[''"]'
        hint: "No debe ser Client Component"
        forbid: true
  - id: d2
    lang: ts
    title: "Route Handler GET con Bearer token"
    timeLimit: 180
    prompt: |
      Escribe `app/api/pedidos/route.ts` con un `GET` que devuelva **401** si la cabecera `Authorization` no empieza
      por `Bearer `, y si la trae, responda `Response.json(await listarPedidos())`.
    solution: |
      import { NextRequest } from 'next/server';
      import { listarPedidos } from '@/lib/pedidos';

      export async function GET(req: NextRequest) {
        const auth = req.headers.get('authorization');
        if (!auth?.startsWith('Bearer ')) {
          return Response.json({ error: 'No autenticado' }, { status: 401 });
        }
        return Response.json(await listarPedidos());
      }
    checks:
      - pattern: 'export\s+async\s+function\s+GET\s*\('
        hint: "`export async function GET(req)`"
      - pattern: 'headers\.get\s*\(\s*[''"]authorization[''"]\s*\)'
        hint: "Lee `req.headers.get('authorization')`"
      - pattern: 'startsWith\s*\(\s*[''"]Bearer [''"]\s*\)'
        hint: "Comprueba el prefijo `'Bearer '`"
      - pattern: 'status\s*:\s*401'
        hint: "Responde con `{ status: 401 }`"
      - pattern: '(Response|NextResponse)\.json\s*\('
        hint: "Usa `Response.json(...)`"
  - id: d3
    lang: tsx
    title: "Server Action con revalidatePath"
    timeLimit: 180
    prompt: |
      Escribe una Server Action `crearTarea(formData: FormData)` que lea `titulo`, lo inserte con `db.tarea.create`
      y revalide la ruta `/tareas`. Valida que el título no esté vacío.
    solution: |
      'use server';
      import { revalidatePath } from 'next/cache';
      import { db } from '@/lib/db';

      export async function crearTarea(formData: FormData) {
        const titulo = String(formData.get('titulo') ?? '').trim();
        if (!titulo) throw new Error('El título es obligatorio');
        await db.tarea.create({ data: { titulo } });
        revalidatePath('/tareas');
      }
    checks:
      - pattern: '^\s*[''"]use server[''"]'
        hint: "Empieza con la directiva `'use server'`"
      - pattern: 'async\s+function\s+crearTarea\s*\(\s*formData\s*:\s*FormData\s*\)'
        hint: "`async function crearTarea(formData: FormData)`"
      - pattern: 'formData\.get\s*\(\s*[''"]titulo[''"]\s*\)'
        hint: "Lee `formData.get('titulo')`"
      - pattern: 'if\s*\(\s*!\s*titulo'
        hint: "Valida que no esté vacío"
      - pattern: 'revalidatePath\s*\(\s*[''"]/tareas[''"]\s*\)'
        hint: "`revalidatePath('/tareas')`"

snippets:
  - id: n1
    title: "Crear proyecto y comandos"
    lang: bash
    code: |
      npx create-next-app@latest mi-app --typescript --app --eslint
      npm run dev          # desarrollo (Turbopack)
      npm run build        # build de producción
      npm start            # servir el build
  - id: n2
    title: "Metadata dinámica (SEO)"
    lang: tsx
    code: |
      export async function generateMetadata({ params }: { params: Promise<{ id: string }> }) {
        const { id } = await params;
        const p = await getProducto(id);
        return { title: p?.nombre ?? 'Producto', description: p?.resumen };
      }
  - id: n3
    title: "Streaming con Suspense"
    lang: tsx
    code: |
      export default function Page() {
        return (
          <>
            <Cabecera />
            <Suspense fallback={<p>Cargando recomendaciones…</p>}>
              <Recomendaciones />   {/* Server Component async lento */}
            </Suspense>
          </>
        );
      }
  - id: n4
    title: "Dockerfile con output standalone"
    lang: dockerfile
    code: |
      # next.config.ts → output: 'standalone'
      FROM node:22-alpine AS build
      WORKDIR /app
      COPY . .
      RUN npm ci && npm run build
      FROM node:22-alpine
      WORKDIR /app
      COPY --from=build /app/.next/standalone ./
      COPY --from=build /app/.next/static ./.next/static
      COPY --from=build /app/public ./public
      CMD ["node", "server.js"]

