id: cs-start-05
number: 5
title: "Clases, objetos y errores"
level: "Inicial"
track: csharp-basics
summary: "Agrupa los datos de un producto, dale comportamiento y distingue una entrada inválida de una excepción."
objectives:
  - "Crear una clase Producto y dos objetos independientes."
  - "Leer propiedades y llamar un método de un objeto."
  - "Validar entradas esperables y comprender un try/catch sencillo."
sections:
  - id: s1
    title: "Agrupa datos que pertenecen juntos"
    body: |
      Un producto tiene nombre, precio y stock. Una **clase** describe esos datos y las acciones disponibles; un **objeto** es una instancia concreta creada a partir de esa descripción. Cada objeto tiene sus propios valores.

      Copia este programa completo. En un Program.cs con instrucciones de nivel superior, las declaraciones de clases van después de esas instrucciones:

      ```csharp
      Producto martillo = new Producto();
      martillo.Nombre = "Martillo";
      martillo.Precio = 25000m;
      martillo.Stock = 10;
      Console.WriteLine($"{martillo.Nombre}: {martillo.Stock} unidades");

      class Producto
      {
          public string Nombre { get; set; } = "";
          public decimal Precio { get; set; }
          public int Stock { get; set; }
      }
      ```

      Nombre, Precio y Stock son **propiedades**. `get` permite leer y `set` asignar. `public` permite acceder desde el código que usa el objeto. El `= ""` da un valor inicial no nulo al nombre; los valores numéricos empiezan en cero. El punto en `martillo.Nombre` accede a un miembro de ese objeto.
    realWorld:
      - sector: Fintech
        text: |
          Los conceptos del negocio se convierten en clases:

          ```csharp
          class Cuenta
          {
              public string Numero { get; set; } = "";
              public string Titular { get; set; } = "";
              public decimal Saldo { get; set; }
          }
          ```

          **Técnico:** estas clases se llaman **entidades del dominio**. Con Entity Framework Core, cada clase se asocia a una tabla de la base de datos y cada propiedad, a una columna. La clase `Producto` de esta lección también sería una tabla en un sistema real.
      - sector: ERP
        text: |
          Los **datos maestros** de un ERP son clases: `Cliente`, `Proveedor`, `Producto` y `Bodega`. Los **documentos** también lo son: `Factura`, `Pedido` y `OrdenDeCompra`.

          **Técnico:** cuando lees "el maestro de clientes" en un proyecto ERP, piensa en una clase `Cliente` con propiedades como NIT o RFC, razón social y cupo de crédito, y en una tabla con una fila por cliente.
  - id: s2
    title: "Una clase, varios objetos"
    body: |
      Cada `new Producto()` crea un objeto. Puedes usar un inicializador entre llaves para asignar sus propiedades al crearlo:

      ```csharp
      Producto martillo = new Producto { Nombre = "Martillo", Stock = 10 };
      Producto clavo = new Producto { Nombre = "Clavo", Stock = 100 };
      martillo.Stock = 9;
      Console.WriteLine(martillo.Stock);
      Console.WriteLine(clavo.Stock);

      class Producto
      {
          public string Nombre { get; set; } = "";
          public int Stock { get; set; }
      }
      ```

      La salida es 9 y 100: cambiar un objeto no cambia el otro. Pero asignar `Producto otro = martillo;` no crea un producto nuevo: ambos nombres apuntan al mismo objeto. Necesitas otro `new` para crear una instancia independiente.

      **Hazlo tú:** crea dos productos distintos, cambia el nombre del primero y muestra ambos. Después prueba la asignación otro = martillo y comprueba qué pasa si modificas otro.Nombre. Este pequeño experimento prepara la idea de referencias sin entrar aún en detalles de memoria.
    realWorld:
      - sector: Fintech
        text: |
          **El error de referencia en un simulador:** quieres mostrar "¿cómo quedaría tu saldo si pagas esta deuda?":

          ```csharp
          Cuenta simulada = cuentaReal;   // ¡NO es una copia!
          simulada.Saldo -= 200000m;      // también cambia cuentaReal
          ```

          Acabas de modificar los datos reales del cliente en una simulación.

          **Técnico:** las clases son **tipos por referencia**. Para simular necesitas un objeto nuevo (`new Cuenta { Saldo = cuentaReal.Saldo }`) o un `record` con `with`, que verás en la ruta de C# moderno.
      - sector: ERP
        text: |
          **"Duplicar pedido"** es una función habitual en un ERP. Si se implementa como `Pedido copia = original;`, al editar la copia también cambias el pedido original del cliente.

          **Técnico:** duplicar exige un `new Pedido { ... }` y copiar los valores, incluida una lista **nueva** de líneas. Si no, ambos pedidos compartirían las mismas líneas.
  - id: s3
    title: "Pon una acción dentro del producto"
    body: |
      Un método es una función declarada dentro de un tipo. Nuestro método `IntentarVender` usa el stock del objeto, valida la cantidad y devuelve un bool para indicar si pudo vender:

      ```csharp
      Producto producto = new Producto { Stock = 5 };
      Console.WriteLine(producto.IntentarVender(2));
      Console.WriteLine(producto.Stock);
      Console.WriteLine(producto.IntentarVender(10));
      Console.WriteLine(producto.Stock);

      class Producto
      {
          public int Stock { get; set; }

          public bool IntentarVender(int cantidad)
          {
              if (cantidad <= 0 || cantidad > Stock)
              {
                  return false;
              }
              Stock = Stock - cantidad;
              return true;
          }
      }
      ```

      La salida es True, 3, False y 3. El primer return termina el método inmediatamente si la venta es inválida. Así no se descuenta stock en ese caso. Cada objeto ejecuta el método con su propio stock.

      Este modelo es deliberadamente sencillo: como Stock tiene un set público, otro código aún podría asignar un negativo. Aquí controlamos las entradas y usamos IntentarVender; proteger todas las modificaciones es un siguiente paso de diseño.
    realWorld:
      - sector: Fintech
        text: |
          **La cuenta protege su propio saldo.** En lugar de permitir que cualquier parte del programa cambie `Saldo`, la clase ofrece un método que valida:

          ```csharp
          class Cuenta
          {
              public decimal Saldo { get; private set; }

              public bool IntentarRetirar(decimal monto)
              {
                  if (monto <= 0 || monto > Saldo) return false;
                  Saldo -= monto;
                  return true;
              }
          }
          ```

          **Técnico:** `private set` impide escribir `cuenta.Saldo = -1000` desde afuera. Esto es **encapsulamiento**: la regla de negocio vive en un solo lugar y no se puede saltar.
      - sector: ERP
        text: |
          `IntentarVender` es, literalmente, la **reserva de inventario** de un ERP: valida y descuenta en una sola operación.

          **Técnico:** el patrón `bool IntentarX(...)` (en inglés, `TryX`, como `TryParse`) se usa cuando fallar es un caso normal del negocio, como no tener stock. Para esos casos se devuelve `false` en lugar de lanzar una excepción.
  - id: s4
    title: "Errores de compilación, entradas inválidas y excepciones"
    body: |
      Un **error de compilación** impide construir el programa: por ejemplo, un nombre mal escrito. Una **excepción** ocurre mientras el programa se ejecuta. Una entrada inválida del usuario es algo esperable que normalmente puedes validar con TryParse y condiciones.

      Este ejemplo provoca deliberadamente una conversión inválida para mostrar cómo funciona try/catch:

      ```csharp
      try
      {
          int cantidad = int.Parse("hola");
          Console.WriteLine(cantidad);
      }
      catch (FormatException)
      {
          Console.WriteLine("El texto no representa un entero");
      }
      Console.WriteLine("El programa continúa");
      ```

      `try` contiene la operación que puede fallar y `catch (FormatException)` maneja ese tipo de excepción. El WriteLine dentro de try no se ejecuta, porque Parse falla antes. Luego se muestran el mensaje de error y El programa continúa. Un catch no arregla errores de compilación ni captura automáticamente cualquier tipo de excepción.

      Para las cantidades que pide nuestro inventario usaremos TryParse, que es más directo para entradas inválidas esperables. No uses un catch vacío para ocultar problemas.

      **Antes de avanzar:** comprueba que IntentarVender rechace cero, negativos y cantidades superiores al stock, y que acepte vender todo el stock disponible sin dejarlo negativo.
    realWorld:
      - sector: Fintech
        text: |
          Distingue los dos tipos de problemas:

          - **Saldo insuficiente** es una **regla de negocio**: se valida con `if` y se responde "fondos insuficientes".
          - **La pasarela de pagos no responde** es una **excepción**: se captura `HttpRequestException` o `TimeoutException`, se registra y se responde "intenta más tarde" **sin cobrar**.

          **Técnico:** nunca escribas `catch { }` vacío en código de dinero. Ocultar un error puede dejar un pago a medias sin que nadie se entere.
      - sector: ERP
        text: |
          **Conciliación bancaria:** el ERP importa el extracto que envía el banco. Si una línea viene dañada, `decimal.Parse` lanza `FormatException`.

          **Técnico:** se captura la excepción **por línea**, se registra cuál falló y se continúa con las demás. El contador revisa después solo las líneas con error, sin perder el resto del archivo.
cards:
  - id: c1
    front: "¿Qué diferencia hay entre clase y objeto?"
    back: "La clase describe un tipo; el objeto es una instancia concreta con sus propios datos."
  - id: c2
    front: "¿Para qué sirven get y set en una propiedad?"
    back: "get permite leer su valor y set asignarlo, según la accesibilidad definida."
  - id: c3
    front: "¿Asignar Producto otro = producto crea un objeto independiente?"
    back: "No. Copia la referencia: ambos nombres apuntan al mismo objeto. new Producto crea una instancia nueva."
  - id: c4
    front: "¿Qué hace return dentro de un método?"
    back: "Termina esa ejecución del método y, si corresponde, devuelve un resultado al llamador."
  - id: c5
    front: "¿Cuándo prefieres TryParse frente a Parse para una entrada del usuario?"
    back: "Cuando una entrada inválida es esperable: TryParse indica si pudo convertir y permite decidir qué mensaje mostrar."
questions:
  - id: q1
    type: mcq
    prompt: "¿Qué expresión crea una instancia nueva de Producto?"
    options: ["new Producto()", "Producto.Stock", "return Producto"]
    answer: 0
    explanation: "new crea la instancia. Acceder a una propiedad o devolver una referencia no equivale a crearla."
  - id: q2
    type: tf
    prompt: "Después de Producto otro = producto, ambos nombres apuntan al mismo objeto."
    answer: true
    explanation: "Producto es una clase: esa asignación copia la referencia, no crea un objeto independiente."
  - id: q3
    type: fill
    prompt: "Stock vale 5. IntentarVender acepta una venta de 2. ¿Cuánto stock queda?"
    answer: "3"
    explanation: "El método descuenta 2 del stock actual: 5 - 2 = 3."
  - id: q4
    type: mcq
    prompt: "Stock vale 3. IntentarVender recibe 10. ¿Cuál debe ser el resultado?"
    options: ["true y stock -7", "false y stock 3", "false y stock 0"]
    answer: 1
    explanation: "La cantidad supera el stock, así que se devuelve false antes de modificarlo."
  - id: q5
    type: tf
    prompt: "try/catch permite ejecutar un programa con errores de compilación."
    answer: false
    explanation: "Primero el programa debe compilar. try/catch maneja excepciones durante la ejecución."
  - id: q6
    type: mcq
    prompt: "Para pedir una cantidad entera al usuario, ¿qué opción comunica un fallo de conversión sin lanzar una excepción por texto inválido?"
    options: ["Console.WriteLine", "int.Parse", "int.TryParse"]
    answer: 2
    explanation: "TryParse devuelve false cuando no puede convertir el texto a int."
